<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    /* Main Layout */
    body {
      width: 500px;
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
      box-sizing: border-box;
    }

    h1 {
      display: block;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #45556C;
      margin-top: 0;
      margin-bottom: 16px;
    }

    /* Buttons */
    #captureBtn {
      display: block;
      width: 100%;
      background-color: #45556C;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      transition: background-color 0.2s;
    }
    
    #captureBtn:hover {
      background-color: #45556C;
    }

    #settingsBtn {
      display: block;
      width: 100%;
      text-align: right;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Settings Pane */
    #settingsPane {
      display: none;
      border-top: 1px solid #ccc;
      padding-top: 10px;
      margin-top: 10px;
    }

    #apiKeyInput {
      width: 100%;
      margin-bottom: 5px;
    }

    #saveStatus {
      color: green;
      margin-left: 10px;
      font-size: 12px;
    }

    /* Tabs Styling */
    .tab-container {
      display: block;
      border-bottom: 2px solid #e5e7eb;
      margin-top: 20px;
    }
    
    .tab-btn {
      display: block;
      width: 100%;
      background: none;
      border: none;
      padding: 12px;
      cursor: pointer;
      color: #6b7280;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px 8px 0 0;
      transition: background-color 0.2s, color 0.2s;
      text-align: left;
    }
    
    .tab-btn.active {
      color: #45556C;
      border-bottom: 3px solid #45556C;
      margin-bottom: -2px;
    }
    
    .tab-btn:hover:not(.active) {
      background-color: #f3f4f6;
    }

    /* Content Pane Styling */
    .tab-pane {
      display: none;
      padding: 16px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-top: none;
      border-radius: 0 0 8px 8px;
      min-height: 120px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    .tab-pane.active {
      display: block;
    }
  </style>
</head>
<body>
  
  <h1>Study Buddy</h1>
  
  <button id="captureBtn">Solve Question</button>
  <button id="settingsBtn">⚙️</button>

  <div id="settingsPane">
    <h4>Settings</h4>
    <input type="password" id="apiKeyInput" placeholder="Enter API Key" />
    <button id="saveSettingsBtn">Save Key</button>
    <span id="saveStatus"></span>
  </div>
  
  <div class="tab-container">
    <button class="tab-btn active" data-target="answerPane">Answer</button>
    <button class="tab-btn" data-target="explainPane">Explanation</button>
  </div>
  
  <div id="answerPane" class="tab-pane active">Answer will be here...</div>
  <div id="explainPane" class="tab-pane">Explanations will appear here...</div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
